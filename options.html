<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options · Restore YouTube Dates &amp; Views</title>
  <link rel="icon" href="icons/icon-48.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="card__header">
      <h1 class="card__title">Restore YouTube Dates &amp; Views</h1>
      <p class="card__subtitle">
        Brings back the long format for dates ("3 months ago") and view counts
        ("13 thousand views") that YouTube shortened.
      </p>
    </header>

    <section class="options">
      <!-- Restore dates -->
      <label class="option">
        <input type="checkbox" id="restoreDates" />
        <span class="option__text">
          <span class="option__label">Restore full dates</span>
          <span class="option__hint">"3 mo. ago" → "3 months ago"</span>
        </span>
      </label>

      <!-- Restore views -->
      <label class="option">
        <input type="checkbox" id="restoreViews" />
        <span class="option__text">
          <span class="option__label">Restore view counts</span>
          <span class="option__hint">"13K" → "13 thousand views"</span>
        </span>
      </label>

      <!-- Logs -->
      <label class="option">
        <input type="checkbox" id="debug" />
        <span class="option__text">
          <span class="option__label">Show logs in the console</span>
          <span class="option__hint">Useful for debugging (DevTools).</span>
        </span>
      </label>

      <!-- Language -->
      <label class="option option--select">
        <span class="option__text">
          <span class="option__label">Language</span>
          <span class="option__hint">Language of the restored text.</span>
        </span>
        <select id="locale" class="option__select">
          <option value="auto">Automatic (match YouTube)</option>
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
    </section>

    <footer class="card__footer">
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </footer>
  </main>

  <script src="constants.js"></script>
  <script src="options.js"></script>
</body>
</html>
